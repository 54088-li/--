<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    section[class^="section"] {
      width: 100%;
      height: 100%;
    }

    .section1 {
      background: url(./tp.png) no-repeat center/cover;
    }

    .content {
      width: 100%;
      height: 18%;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
    }

    .section2 {
      background: url(./tp2.png) no-repeat center/cover;
    }
  </style>
</head>

<body>
  <section class="section1">
    <div class="content">
      <p>晨光穿透薄雾，洒落在连绵的山脊之上，远处的云海翻涌如潮，近处的草木被镀上一层金色的轮廓。</p>
      <p>这一刻，大自然的壮美与宁静交织，仿佛时间都为之驻足。雪山之巅</p>
    </div>
  </section>
  <section class="section2">
    <div class="content">
      <p>雪山之巅</p>
    </div>
  </section>
</body>

</html>
