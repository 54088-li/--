<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .data {
      border-collapse: collapse;
    }

    .data th,
    .data td {
      border: 1px solid rgb(249, 246, 248);
      width: 400px;
      margin: 0 auto;
      text-align: center;
      font-size: 14px;
    }

    .data tr:nth-child(odd) {
      background-color: #f5f5f5;
    }

    /* 表头：用 th 选择器，权重更高，不会被奇数行的颜色覆盖 */
    .data tr:first-child th {
      background-color: #7ac3eb;
    }

    .data tr:hover {
      background-color: #548394;
    }

    .data tr {
      height: 35px;
    }
  </style>
</head>

<body>
  <table class="data">
    <tr>
      <th>姓名</th>
      <th>数据</th>
      <th>日期</th>
    </tr>
    <tr>
